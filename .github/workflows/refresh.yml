name: 시세 자동 갱신

# schedule 를 다시 붙였다 (2026-08-06)
#
#   예전엔(2026-08-02) 워커 dispatch 와 GitHub cron 이 겹쳐 같은 일을 두 번 하길래
#   schedule 을 지우고 워커만 남겼다. 그런데 워커(무료 플랜 cron)가 오후 슬롯을
#   통째로 빼먹는 날이 있어(08-06: 오전만 뜨고 09~18시 하나도 안 뜸) 시세가 21시간
#   멈췄다. 다른 워크플로(events·movie·screens·trade)는 전부 GitHub schedule 백업이
#   있어 멀쩡했다 — 시세만 워커 단독이라 죽은 것.
#
#   그래서 schedule 을 되살리되, 겹침 과금은 아래 gate 의 '중복 방지'로 막는다:
#   직전 '시세 자동 갱신' 커밋이 90분 안쪽이면 그 회차는 체크아웃 전에 끝낸다(과금 1분).
#   워커가 살아있는 날엔 GitHub 회차가 대부분 여기서 빠지고, 워커가 죽은 날만 실제 수집.
#   concurrency: repo-write 가 직렬화하므로 뒤 회차는 앞 회차의 커밋을 보고 판정한다.
#
#   주기를 바꾸려면 아래 cron 과 Cloudflare 워커의 Cron Trigger 를 함께 볼 것.

on:
  schedule:
    # 슬롯(KST 평일 08·10·12·14·16·18, 주말 12·20)을 UTC 로 적는다. UTC 시각:
    #   23→08, 01→10, 03→12, 05→14, 07→16, 09→18 (평일) · 03→12, 11→20 (주말)
    # gate 가 실제 KST 요일·시각으로 다시 정밀 필터하므로 여기선 합집합만 건다.
    # :05 로 둬 워커(:00)를 먼저 태우고, 워커가 죽은 날만 이쪽이 실제 수집한다.
    - cron: "5 23,1,3,5,7,9,11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "슬롯이 아니어도 강제로 돌릴까요? (아무 값이나 넣으면 강제)"
        required: false
        default: ""

permissions:
  contents: write

# public/index.html 을 쓰는 워크플로는 전부 같은 그룹에 둔다.
# 따로 두었더니 둘이 동시에 돌아 커밋 단계에서 리베이스 충돌로 죽었다
# (최근 40회 중 6회 실패, 실패 회차가 평균 18분씩을 태웠다).
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # 워커는 평일 07~18시를 매시간 부른다. 그런데 회당 실측 7.7분이라
      # 하루 93분·월 2,790분이 나간다 — 한도 2,000분을 이것 하나로 넘긴다.
      #
      # 스텝마다 시간대를 보게 해 뒀지만 그건 이미 러너를 띄우고 체크아웃과
      # 파이썬 설치를 끝낸 뒤의 이야기라, 아무 일도 안 하는 회차도 분을 먹는다.
      # 그래서 체크아웃보다 먼저 판정한다(빈 회차는 10초 안쪽).
      #
      # 슬롯을 08·10·12·14·16·18 로 잡은 이유는 collector_health.deploy_slot()
      # 과 같은 값이기 때문이다. 다르게 잡으면 수집은 했는데 배포 슬롯이 아니라
      # [CI Skip] 이 붙어 화면이 안 바뀌는 회차가 생긴다.
      # 주말은 워커가 KST 00·04·08·12·16·20 을 부르는데 장이 안 열리므로 12·20 만.
      - name: 지금 돌 시각인가
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Asia/Seoul date +%H); d=$(TZ=Asia/Seoul date +%u)
          go=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.force }}" ]; then
            go=1; echo "수동 강제 실행"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # ⚠ 예약 회차는 정시 슬롯으로 판정하면 안 된다.
            #   GitHub 예약은 이 계정에서 3~12시간씩 밀린다(실측 5건: +3.0 +3.6 +3.6 +11.0 +11.7).
            #   08시 예약이 11시에 도착하는데 게이트가 짝수 시만 받으면 전부 튕긴다 —
            #   계산해 보니 21가지 도착 경우 중 슬롯에 걸리는 게 0건이었다.
            #   즉 백업이 영영 수집을 안 한다. 워커가 죽은 날 시세가 하루 종일 멈춘다.
            #
            #   그래서 예약 회차는 '장 시간 안이면' 통과시키고, 겹침 과금은 아래
            #   중복 방지(직전 시세 커밋 90분)가 막는다. 워커가 살아 있는 날엔
            #   예약 회차가 거기서 대부분 걸러져 12초로 끝난다.
            if [ "$d" -le 5 ]; then
              [ "$((10#$h))" -ge 8 ] && [ "$((10#$h))" -le 19 ] && go=1
            else
              [ "$((10#$h))" -ge 10 ] && [ "$((10#$h))" -le 20 ] && go=1
            fi
          elif [ "$d" -le 5 ]; then
            case "$h" in 08|10|12|14|16|18) go=1 ;; esac
          else
            case "$h" in 12|20) go=1 ;; esac
          fi
          # 중복 방지 — 워커와 GitHub schedule 두 트리거가 같은 슬롯을 두 번 수집하면
          # 비공개 저장소 분이 이중 과금된다. 직전 '시세 자동 갱신' 커밋이 90분 안쪽이면
          # 다른 트리거가 이미 이 슬롯을 처리한 것이므로 체크아웃 전에 끝낸다.
          # (강제 실행은 예외 — 사람이 일부러 돌린 것이니 건너뛰지 않는다.)
          if [ "$go" = "1" ] && [ -z "${{ github.event.inputs.force }}" ]; then
            last=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits?per_page=10" \
              | jq -r '[.[] | select(.commit.message | startswith("시세 자동 갱신")) | .commit.committer.date] | first // empty' 2>/dev/null)
            if [ -n "$last" ]; then
              age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 60 ))
              if [ "$age" -ge 0 ] && [ "$age" -lt 90 ]; then
                go=0; echo "직전 시세 갱신이 ${age}분 전 - 다른 트리거가 처리함, 중복 방지로 건너뜁니다"
              fi
            fi
          fi
          echo "go=$go" >> $GITHUB_OUTPUT
          [ "$go" = "1" ] && echo "KST ${h}시 - 수집 슬롯" || echo "KST ${h}시 - 슬롯 아님/중복, 여기서 끝냅니다"

      - name: 저장소 가져오기
        if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4

      - name: 파이썬 준비
        if: steps.gate.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 워커가 밤·주말에도 부르는데 그 시각엔 값이 안 바뀌면서 시간만 먹는다.
      # 무거운 단계는 필요한 시간대에만 돌린다. 아래 스텝들이 이 값을 본다.
      - name: 시간대 판정(KST)
        if: steps.gate.outputs.go == '1'
        id: t
        run: |
          echo "h=$(TZ=Asia/Seoul date +%H)" >> $GITHUB_OUTPUT
          echo "d=$(TZ=Asia/Seoul date +%u)" >> $GITHUB_OUTPUT   # 1=월 … 7=일

      # 평일 08~18 매시간. 회당 3.2~4.0분(실측 08-03~08-04) = 하루 약 42분.
      #   2시간 간격에서 매시간으로 올리며 월 약 570분이 늘었다.
      # 밤·주말은 값이 안 바뀌므로 워커가 불러도 여기서 뺀다.
      #
      # ⚠ 컨센은 여기서 매시간 받지 않는다 — refresh_live.py 가 '그날 첫 회차'에만
      #   깊게 받고(종목당 5요청) 나머지는 시세만(2요청) 가져온다. 목표주가·투자의견은
      #   리포트가 나와야 바뀌는 값이라 매시간 받아도 같은 값이고, 요청량만 2.5배가 된다.
      #   네이버 금융은 키 없는 비공개 엔드포인트라 차단 위험 1순위다.
      - name: 시세·리포트·일정 재수집
        if: steps.gate.outputs.go == '1'
        run: |
          h=${{ steps.t.outputs.h }}; d=${{ steps.t.outputs.d }}
          if [ "$d" -le 5 ] && [ "$((10#$h))" -ge 8 ] && [ "$((10#$h))" -le 18 ]; then
            python runstep.py "시세·컨센" refresh_live.py
          else
            echo "장 시간 밖 또는 주말 - 생략"
          fi

      - name: 종목 뉴스 재수집
        if: steps.gate.outputs.go == '1'
        run: |
          h=${{ steps.t.outputs.h }}; d=${{ steps.t.outputs.d }}
          if [ "$d" -le 5 ] && [ "$((10#$h))" -ge 8 ] && [ "$((10#$h))" -le 19 ]; then
            python runstep.py "종목 뉴스" fetch_news.py
          else
            echo "장 시간 밖 - 생략"
          fi

      # DART 공시는 장중에 올라오지만 2.25분짜리라 매시간은 과하다.
      # 개장 직후·점심·장 마감 후 세 번이면 당일 안에 다 잡힌다.
      - name: DART 공시·IR 재수집
        if: steps.gate.outputs.go == '1'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          case "${{ steps.t.outputs.d }}:${{ steps.t.outputs.h }}" in
            [1-5]:10|[1-5]:14|[1-5]:18) python runstep.py "DART 공시" fetch_events.py ;;
            *) echo "해당 시간대 아님 - 생략" ;;
          esac

      # 잠정실적 — DART '영업(잠정)실적(공정공시)'. 하루 두 번이면 충분하다.
      - name: 잠정실적 수집(DART)
        if: steps.gate.outputs.go == '1'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          case "${{ steps.t.outputs.d }}:${{ steps.t.outputs.h }}" in
            [1-5]:10|[1-5]:18) python runstep.py "잠정실적" fetch_prelim.py ;;
            *) echo "해당 시간대 아님 - 생략" ;;
          esac

      # 영화 예매·박스오피스 — KOBIS 실시간 예매값은 종일 바뀌므로 주말에도 돈다.
      # (예전엔 이 스텝과 '주말' 스텝이 따로 있어 토·일엔 같은 걸 두 번 받았다.
      #  0.73분짜리 중복이라 지웠다 — 요일 구분 없이 여기서 한 번만 한다.)
      - name: 영화 예매·박스오피스 수집
        if: steps.gate.outputs.go == '1'
        env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
        run: python runstep.py "영화 예매" fetch_movie.py

      # 치지직·트위치는 회당 10초 안쪽이라 매번 돈다.
      # 그날 최댓값(저녁 피크)을 잡는 게 목적이라 자주 볼수록 정확하다.
      - name: 치지직 게임 시청자
        if: steps.gate.outputs.go == '1'
        run: python runstep.py "치지직" fetch_chzzk.py

      - name: 트위치 게임 시청자
        if: steps.gate.outputs.go == '1'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python runstep.py "트위치" fetch_twitch.py

      # 스크린 배정·예매는 screens.yml 이 전담한다(여기 붙였더니 회당 20분이 됐다).

      - name: 실적 발표 알림
        if: steps.gate.outputs.go == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py || echo "알림 건너뜀"

      # 수집이 막히거나 굳으면 별도 메시지로 알린다(데일리 레터와 섞지 않는다).
      # screens.yml 에만 두었더니 8시간에 한 번뿐이라, 재알림 주기(6시간)보다 느렸다.
      # 회당 5초라 여기서 매번 돌려도 부담이 없다. 정상이면 아무것도 안 보낸다.
      - name: 건강검진 알림
        if: steps.gate.outputs.go == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watchdog.py || echo "건강검진 건너뜀"

      - name: 변경분 커밋
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # notified.json 도 같이 본다 — 알림 발송 기록이라 빠지면 같은 실적을 또 쏜다
          git add archive 2>/dev/null || true
          if git diff --quiet --cached -- . && git diff --quiet -- public/index.html notified.json health.json watchdog_state.json; then
            echo "변경 없음 - 커밋 생략"; exit 0
          fi
          git add public/index.html notified.json health.json watchdog_state.json 2>/dev/null || true
          # Cloudflare Pages 는 푸시 1건 = 빌드 1건이고 무료 한도가 월 500건이다.
          # 30일 실측 472건으로 이미 94% 를 쓰고 있었다. 수집은 자주 하되 배포는
          # 시세가 실제로 바뀌는 슬롯에서만 한다 — 사이 회차 커밋에 '[CI Skip]' 을 달면
          # Cloudflare 가 그 푸시를 건너뛰고, 다음 배포가 그 데이터까지 같이 싣는다.
          # 예약(schedule) 회차가 여기까지 왔다는 건 중복 방지를 통과했다는 뜻 —
          # 즉 워커가 그 슬롯을 못 했다는 것이다. 그런 회차까지 [CI Skip] 을 달면
          # 수집은 했는데 화면이 안 바뀐다. 워커가 죽은 날 하루 종일 옛 숫자가 뜬다.
          if [ "${{ github.event_name }}" = "schedule" ] || python -c "import sys,collector_health as c; sys.exit(0 if c.deploy_slot() else 1)"; then
            SKIP=""
          else
            SKIP=" [CI Skip]"
            echo "배포 슬롯 아님 - 커밋만 하고 Cloudflare 빌드는 건너뜀"
          fi
          git commit -m "시세 자동 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')${SKIP}"
          # 사람이 로컬에서 밀어 넣는 일도 있어 푸시가 밀릴 수 있다. 몇 번 다시 붙인다.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "푸시 밀림 - 재시도 $i"
            git fetch origin main
            if ! git rebase origin/main; then
              # 같은 블록이 동시에 바뀌면 리베이스가 막힌다. 억지로 풀면 남의 수정을
              # 덮어쓴다 — 이번 회차는 접고 다음 실행이 다시 수집하게 둔다.
              git rebase --abort || true
              echo "리베이스 충돌 - 이번 회차 커밋 포기(다음 실행이 재수집)"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "푸시 5회 실패"; exit 1
