name: 시세 자동 갱신

on:
  schedule:
    # ── 평일 한국시간 07~18시, 매시 정각 ──
    - cron: "0 22,23 * * 0-4"     # KST 07,08시 (UTC 전일 22,23시)
    - cron: "0 0-9 * * 1-5"       # KST 09~18시
    # ── 주말 한국시간 4시간마다 (00,04,08,12,16,20시) ──
    - cron: "0 15,19,23 * * 5"    # KST 토 00,04,08시
    - cron: "0 3,7,11,15,19,23 * * 6"  # KST 토 12,16,20 / 일 00,04,08시
    - cron: "0 3,7,11 * * 0"      # KST 일 12,16,20시
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시세·리포트·일정 재수집
        run: python refresh_live.py

      - name: 종목 뉴스 재수집
        run: python fetch_news.py || echo "뉴스 수집 건너뜀(네이버 응답 이상)"

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "변경 없음 - 커밋 생략"
          else
            git add public/index.html
            git commit -m "시세 자동 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase
            git push
          fi
