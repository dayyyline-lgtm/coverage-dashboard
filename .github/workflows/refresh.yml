name: 시세 자동 갱신

on:
  schedule:
    # ── 평일 한국시간 07~18시, 매시 정각 ──
    - cron: "0 22,23 * * 0-4"     # KST 07,08시 (UTC 전일 22,23시)
    - cron: "0 0-9 * * 1-5"       # KST 09~18시
    # ── 주말 한국시간 4시간마다 (00,04,08,12,16,20시) ──
    - cron: "0 15,19,23 * * 5"    # KST 토 00,04,08시
    - cron: "0 3,7,11,15,19,23 * * 6"  # KST 토 12,16,20 / 일 00,04,08시
    - cron: "0 3,7,11 * * 0"      # KST 일 12,16,20시
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시세·리포트·일정 재수집
        run: python refresh_live.py

      - name: 종목 뉴스 재수집
        run: python fetch_news.py || echo "뉴스 수집 건너뜀(네이버 응답 이상)"

      # 치지직 게임 시청자(키 불필요). 매시간 돌아 그날 최댓값(저녁 피크)을 잡는다.
      - name: 치지직 게임 시청자
        run: python fetch_chzzk.py || echo "치지직 수집 건너뜀"

      # 트위치 게임 시청자(글로벌). TWITCH_CLIENT_ID/SECRET 있어야 동작, 없으면 스킵.
      - name: 트위치 게임 시청자
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python fetch_twitch.py || echo "트위치 수집 건너뜀"

      # 시세 갱신 직후에 돌려야 방금 확정된 실적을 바로 잡는다.
      # 토큰이 없으면 조용히 넘어가므로 수집 자체는 영향받지 않는다.
      - name: 실적 발표 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py || echo "알림 건너뜀"

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # notified.json 도 같이 본다 — 알림 발송 기록이라 빠지면 같은 실적을 또 쏜다
          if git diff --quiet -- public/index.html notified.json; then
            echo "변경 없음 - 커밋 생략"
          else
            git add public/index.html notified.json
            git commit -m "시세 자동 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase
            git push
          fi
