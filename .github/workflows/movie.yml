name: 영화 흥행 갱신 (KOBIS)

on:
  schedule:
    # 매일 한국시간 10:00 (UTC 01:00) — 전날 확정치가 오전에 올라온다
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # public/index.html 을 쓰는 워크플로는 한 그룹으로 묶어 동시 실행을 막는다.
  # 따로 두면 커밋 단계에서 리베이스 충돌로 죽는다(실측 실패율 15%).
  group: repo-write
  cancel-in-progress: false

jobs:
  movie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 박스오피스 수집
        env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
        run: python fetch_movie.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "변경 없음 - 커밋 생략"; exit 0
          fi
          git add public/index.html archive
          # 이 워크플로는 Cloudflare 빌드를 소비하지 않는다 — refresh.yml 이 같은
          # fetch_movie.py 를 하루 12번 돌리고 그중 6번을 배포하므로, 여기서 또 빌드하면
          # 월 30건(한도 500건의 6%)을 같은 데이터에 쓰는 셈이다. 다음 배포가 같이 싣는다.
          # 손으로 돌린 회차는 배포한다 — 지금 보려고 누른 것이라 화면이 안 바뀌면 의미가 없다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SKIP=""; else SKIP=" [CI Skip]"; fi
          git commit -m "영화 흥행 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')${SKIP}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "리베이스 충돌 - 이번 회차 커밋 포기"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "푸시 5회 실패"; exit 1
