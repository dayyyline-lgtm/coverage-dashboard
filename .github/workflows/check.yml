name: 배포 전 점검

# public/ 이 바뀔 때마다 화면이 멀쩡한지 확인한다.
#
# 왜 필요한가
#   지금 안전망은 전부 '사후'다. alert.yml 은 워크플로가 죽어야 알고,
#   watchdog.py 는 데이터가 12시간 굳어야 안다. 그 사이 —
#   '수집도 됐고 워크플로도 초록불인데 화면이 비어 있다' — 를 보는 눈이 없었다.
#   그래서 사람이 매번 브라우저를 열어 확인했다(2026-08-08 하루에 6번).
#
# 두 겹인 이유 (실측: 고장을 심어 확인)
#   app.js 는 `typeof X !== "undefined"` 로 곳곳을 방어한다. 그래서 상수가
#   사라지거나 껍데기만 남아도 **예외가 안 나고 화면만 조용히 빈다.**
#   렌더 점검은 이 두 고장을 못 잡았고, 정적 점검이 잡았다. 반대로 app.js
#   연결이 끊긴 것은 둘 다 잡았다. 한 겹만 두면 절반이 샌다.
#
#     고장                      정적   렌더
#     상수 이름이 사라짐          ✓      ✗
#     블록이 껍데기만 남음        ✓      ✗
#     app.js 참조가 끊김          ✓      ✓
#
# 비용
#   저장소가 공개라 Actions 분은 무제한이다. 회당 1~2분.
#   커밋을 만들지 않으므로 Cloudflare Pages 빌드(500/월)를 쓰지 않는다.
#   같은 브랜치에 새 푸시가 오면 이전 회차를 취소한다(봇이 몰아칠 때 겹치지 않게).
#
# ⚠ repo-write 그룹에 넣지 않는다 — 이 워크플로는 저장소에 쓰지 않는다.
#   거기 넣으면 수집기들 뒤에 줄을 서서 점검이 한참 늦게 돈다.

on:
  push:
    paths:
      - "public/**"
      - "precheck.py"
      - "check_render.py"
      - ".github/workflows/check.yml"
  workflow_dispatch:

concurrency:
  group: precheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 정적 점검이 먼저다 — 의존성이 없어 1초면 끝나고, 브라우저 설치(40초)를
      # 시작하기 전에 명백한 고장을 걸러낸다.
      - name: 정적 점검
        id: static
        run: python precheck.py

      # 브라우저는 캐시한다. 없으면 회당 40초씩 다시 받는다.
      - name: 브라우저 캐시
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: 브라우저 준비
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: 렌더 점검
        run: python check_render.py

      # 실패했을 때만 알린다. 정상이면 아무 소리도 내지 않는다 —
      # '오늘도 왔네' 하고 지나치기 시작하면 경보가 죽는다(watchdog.py 와 같은 원칙).
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHO: ${{ github.event.head_commit.message }}
          STATIC: ${{ steps.static.outcome }}
        run: |
          python - <<'PY'
          import os, datetime, telegram_send
          KST = datetime.timezone(datetime.timedelta(hours=9))
          now = datetime.datetime.now(KST).strftime("%m/%d %H:%M")
          url = os.environ.get("URL", "")
          who = " ".join((os.environ.get("WHO") or "").split())[:80]
          # 어느 겹에서 걸렸는지 알려 주면 열어 보기 전에 성격을 짐작할 수 있다.
          layer = ("데이터·구조(정적 점검)" if os.environ.get("STATIC") == "failure"
                   else "화면 실행(렌더 점검)")
          msg = (f"🛠 <b>배포 전 점검 실패</b>\n{now} 기준\n\n"
                 f"• 걸린 곳: <b>{layer}</b>\n"
                 f"• 직전 커밋: {who}\n\n"
                 f"<i>지금 배포된 화면이 깨져 있을 수 있습니다. "
                 f"어디가 걸렸는지는 아래 기록에 한 줄로 적혀 있습니다.</i>\n\n"
                 f'<a href="{url}">🔎 점검 기록 보기</a> · '
                 f'<a href="https://coverage-dashboard.pages.dev">📊 대시보드</a>')
          print(msg)
          telegram_send.send(msg)
          PY
