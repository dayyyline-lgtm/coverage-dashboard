name: 트렌드 갱신 (네이버·구글)

on:
  # 2026-08-07: 매일 아침 레터(events.yml) 직후 전체 트렌드(네이버·구글·얀덱스)를 갱신한다.
  # 레터가 쓰는 네이버 트렌드는 events.yml 안에서 레터 前에 이미 갱신되고(정시성 보호),
  # 느린 구글·얀덱스는 여기서 레터 直後에 받아 아침마다 대시보드를 싹 신선하게 만든다.
  # (레터 앞에 붙이면 구글 요청지연으로 레터가 밀리므로, 뒤에 얹는다.)
  workflow_run:
    workflows: ["아침 데이터 갱신 + 데일리 레터"]
    types: [completed]
  schedule:
    # 백업 — 워커·workflow_run 이 다 걸른 날의 최후 보루(주 1회). 한국시간 월 08:00.
    - cron: "0 23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # public/index.html 을 쓰는 워크플로는 한 그룹으로 묶어 동시 실행을 막는다.
  # 따로 두면 커밋 단계에서 리베이스 충돌로 죽는다(실측 실패율 15%).
  group: repo-write
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install --quiet requests trendspy

      - name: 트렌드 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 선택 — 없으면 러시아 계열만 건너뛰고 나머지는 정상 수집한다.
          # 얀덱스 Wordstat = 러시아 검색(구글보다 점유율이 높다).
          # 예전엔 OAuth + Direct 지원팀 승인이 필요했지만 Yandex Cloud Search API 로
          # 이관돼 API 키만으로 쓴다. folderId 는 요청 본문 필수값이라 같이 받는다.
          #   https://searchapi.api.cloud.yandex.net/v2/wordstat/dynamics
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: |
          if [ -z "$NAVER_CLIENT_ID" ]; then
            echo "NAVER_CLIENT_ID 시크릿이 없습니다. Settings > Secrets 에 등록하세요."
            exit 1
          fi
          python fetch_trends.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "변경 없음 - 커밋 생략"
          else
            git add public/index.html
            git commit -m "트렌드 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase
            git push
          fi
