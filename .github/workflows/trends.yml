name: 트렌드 갱신 (네이버·구글)

on:
  # 2026-08-07: 전체 트렌드(네이버·구글·얀덱스)는 이제 매일 아침 수집(events.yml, KST 05시)이
  # 함께 받는다. 여기 trends.yml 은 주 1회 백업으로만 둔다(수집이 며칠 걸른 경우의 보루).
  schedule:
    - cron: "0 23 * * 0"      # 한국시간 월요일 08:00 (주 1회 백업)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # public/index.html 을 쓰는 워크플로는 한 그룹으로 묶어 동시 실행을 막는다.
  # 따로 두면 커밋 단계에서 리베이스 충돌로 죽는다(실측 실패율 15%).
  group: repo-write
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install --quiet requests trendspy

      - name: 트렌드 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 선택 — 없으면 러시아 계열만 건너뛰고 나머지는 정상 수집한다.
          # 얀덱스 Wordstat = 러시아 검색(구글보다 점유율이 높다).
          # 예전엔 OAuth + Direct 지원팀 승인이 필요했지만 Yandex Cloud Search API 로
          # 이관돼 API 키만으로 쓴다. folderId 는 요청 본문 필수값이라 같이 받는다.
          #   https://searchapi.api.cloud.yandex.net/v2/wordstat/dynamics
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: |
          if [ -z "$NAVER_CLIENT_ID" ]; then
            echo "NAVER_CLIENT_ID 시크릿이 없습니다. Settings > Secrets 에 등록하세요."
            exit 1
          fi
          python fetch_trends.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "변경 없음 - 커밋 생략"
          else
            git add public/index.html
            git commit -m "트렌드 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase
            git push
          fi
