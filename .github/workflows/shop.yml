name: 쇼핑 수요 갱신 (와일드베리즈·라쿠텐)

on:
  schedule:
    # 매주 월요일 한국시간 08:30 (UTC 일 23:30)
    # 두 API 모두 '현재 스냅샷'만 주므로 주 1회 찍어 시계열을 직접 쌓는다.
    - cron: "30 23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # public/index.html 을 쓰는 워크플로는 한 그룹으로 묶어 동시 실행을 막는다.
  # 따로 두면 커밋 단계에서 리베이스 충돌로 죽는다(실측 실패율 15%).
  group: repo-write
  cancel-in-progress: false

jobs:
  shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 쇼핑 수요 수집
        env:
          # 와일드베리즈(러시아)는 인증이 없다. 라쿠텐만 키가 필요하고,
          # 키가 없으면 일본 계열만 건너뛰고 러시아는 그대로 수집된다.
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        # ⚠ runstep 을 거친다 — 예전엔 `python fetch_shop.py` 라 실패해도 사유가 아무 데도 안 남았다.
        #   2026-09-07(월) 회차가 그렇게 조용히 빠졌고, 주 1회라 아무도 며칠간 몰랐다.
        run: python runstep.py "쇼핑 수요" fetch_shop.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # health.json 을 빼면 runstep 이 남긴 실패 기록이 원격에 안 올라가 watchdog 이 못 본다.
          if git diff --quiet -- public/index.html health.json; then
            echo "변경 없음 - 커밋 생략"
          else
            git add public/index.html health.json
            git commit -m "쇼핑 수요 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase
            git push
          fi
