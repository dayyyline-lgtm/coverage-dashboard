name: 트렌드 그룹 선택 수집
# 새 트렌드 그룹을 추가했을 때 **그 그룹만** 받아 채운다(19그룹 전체를 다시 받지 않는다).
# 얀덱스 키가 Actions secrets 에만 있어 로컬에서 못 돌리는 문제도 이걸로 푼다.
#
# 쓰는 법: trend_only.txt 에 그룹 이름을 한 줄에 하나씩 적고 push 하면 그 그룹만 수집한다.
#          (이름은 fetch_trends.py 의 GROUPS 키 · 부분 일치)
# 다른 그룹은 index.html 의 기존 값을 그대로 옮기므로 덮어쓰지 않는다(fetch_trends.py 의 --only).
on:
  push:
    paths: ["trend_only.txt"]
  workflow_dispatch:
concurrency:
  group: repo-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests trendspy
      - name: 선택 그룹 수집
        env:
          PYTHONIOENCODING: utf-8
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: |
          ARGS=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue;; esac
            ARGS="$ARGS --only=$line"
          done < trend_only.txt
          echo "대상: $ARGS"
          python runstep.py "트렌드 선택수집" fetch_trends.py $ARGS
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html health.json watchdog_state.json 2>/dev/null || true
          git commit -m "트렌드 선택수집 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')" || exit 0
          for i in 1 2 3; do git push && exit 0; git fetch origin main; git rebase origin/main || { git rebase --abort; exit 0; }; done
