name: 스크린 배정·예매 추적

# 개봉 전후엔 배정과 예매가 하루에도 크게 움직인다. 2시간마다 잡는다(08~20).
#
# 무엇이 2시간마다 새로 오는지 — 그날 첫 회차만 3사 전체를 훑고(fetch_screens.py 의
# want_full: last_full != 오늘), 나머지 회차는 CGV 만 다시 잰다. 롯데는 237개관,
# 메가는 지역 8곳 순회라 매번 돌리면 회당 시간이 감당이 안 된다.
#   => 08시 = CGV+롯데+메가 / 10·12·14·16·18 = CGV 만 (나머지 체인은 직전 값 유지)
# 롯데·메가까지 자주 보려면 want_full 조건을 바꿔야 하고, 그건 회당 27분짜리가 된다.
#
# ⚠ GitHub 자체 cron 만 믿으면 안 돈다 (2026-08-03 실측)
#   "5 */8 * * *" 로 걸어 뒀는데 7일간 2회만 떴다. 그것도 16:05 예약이 20:15 에 뜨는 식으로
#   4시간씩 밀렸다. 이 저장소에서 GitHub cron 은 '뜨긴 하는데 언제 뜰지 모르는' 물건이다.
#
#   그래서 확실히 도는 것에 얹는다 — Cloudflare Worker 가 refresh.yml 을 하루 12번
#   workflow_dispatch 로 부르고, 그건 실측상 안 밀린다. 그 뒤에 이어서 돈다.
#   다만 12번을 다 돌면 Actions 분이 감당이 안 되므로, 맨 앞에서 한국시간을 보고
#   정해진 슬롯이 아니면 체크아웃도 하기 전에 빠진다(빈 실행은 10초 안쪽).
#
#   cron 도 그대로 둔다. 워커가 죽은 날의 최후 보루다.
#   둘이 겹쳐 떠도 fetch_screens.py 가 '직전 수집이 45분 안이면 건너뜀'으로 스스로 거른다.

on:
  schedule:
    - cron: "5 */8 * * *"      # 백업. 정시성은 기대하지 않는다
  workflow_run:
    workflows: ["시세 자동 갱신"]
    types: [completed]
  workflow_dispatch:
    inputs:
      full:
        description: "전 날짜 전수 조사(느림). 비우면 가까운 날짜만"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # public/index.html 을 쓰는 워크플로는 한 그룹으로 묶어 동시 실행을 막는다.
  # 따로 두면 커밋 단계에서 리베이스 충돌로 죽는다(실측 실패율 15%).
  group: repo-write
  cancel-in-progress: false

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      # 체크아웃보다 먼저 판정한다 — 슬롯이 아니면 여기서 끝내야 분이 안 나간다.
      # cron·수동 실행은 무조건 통과시키고, refresh.yml 에 얹혀 온 것만 시간으로 거른다.
      #
      # 2시간 간격(08~20). 개봉 전후엔 배정·예매가 하루에도 크게 움직여서
      # 4시간(08·12·16·20)으로는 변곡점을 놓친다.
      #
      # 비용은 실측으로 확인하고 늘렸다 — 여기서 도는 건 증분 수집(--hot)이라
      # 회당 평균 1.1분(13회 실측)이다. 하루 3회 늘려도 월 100분 남짓.
      #   ⚠ refresh.yml 주석의 '회당 20분'은 전수조사(--force) 얘기다. 헷갈리지 말 것.
      #     8시간 cron 이 부르는 --force 만 27분(4회 실측)이고, 그건 가끔만 뜬다.
      #
      # 평일엔 워커가 07·08 + 09~18 만 부르므로 20 슬롯은 주말에만 걸린다.
      - name: 지금 돌 시각인가
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "go=1" >> $GITHUB_OUTPUT; echo "cron/수동 실행 - 그냥 진행"; exit 0
          fi
          h=$(TZ=Asia/Seoul date +%H)
          case "$h" in
            08|10|12|14|16|18|20) echo "go=1" >> $GITHUB_OUTPUT; echo "KST ${h}시 - 수집 슬롯" ;;
            *)                    echo "go=0" >> $GITHUB_OUTPUT; echo "KST ${h}시 - 슬롯 아님, 건너뜀" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.11"

      - name: 스크린 배정·예매 수집
        if: steps.gate.outputs.go == '1'
        run: |
          if [ -n "${{ github.event.inputs.full }}" ]; then
            python fetch_screens.py --force || echo "스크린 추적 건너뜀"
          else
            python fetch_screens.py --hot || echo "스크린 추적 건너뜀"
          fi

      # 수집이 막히거나 굳으면 별도 메시지로 알린다(데일리 레터와 섞지 않는다).
      # 정상이면 아무것도 보내지 않는다. 상태파일이 있어야 같은 걸 반복해서 안 쏜다.
      - name: 건강검진 알림
        if: steps.gate.outputs.go == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watchdog.py || echo "건강검진 건너뜀"

      - name: 변경분 커밋
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html archive health.json watchdog_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"; exit 0
          fi
          # Cloudflare 는 푸시 1건 = 빌드 1건이고 무료 한도가 월 500 이다.
          # 하루 4번 다 배포할 필요는 없어 아침·저녁 두 번만 내보낸다.
          # 나머지 회차 데이터는 다음 배포가 같이 싣는다(git 에는 이미 들어가 있다).
          # 단, 손으로 돌린 회차는 무조건 배포한다 — 지금 보려고 누른 것이라
          # 시각이 슬롯이 아니라는 이유로 화면이 안 바뀌면 누른 의미가 없다.
          h=$(TZ=Asia/Seoul date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SKIP=""; echo "수동 실행 - 바로 배포"
          else
            case "$h" in 08|09|16|17) SKIP="" ;; *) SKIP=" [CI Skip]" ;; esac
          fi
          git commit -m "스크린·예매 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')${SKIP}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "푸시 밀림 - 재시도 $i"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "리베이스 충돌 - 이번 회차 커밋 포기(다음 실행이 재수집)"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "푸시 5회 실패"; exit 1
