name: 스크린 배정·예매 추적

# 개봉 전후엔 배정과 예매가 하루에도 크게 움직인다. 매시간 잡는다.
#
# 트리거가 둘인 이유
#   - GitHub 자체 cron: 이 저장소에서 발화는 하지만 30~70분씩 늦는다(07:10 예약 → 08:20 실행).
#     그래도 밤·주말처럼 워커가 안 부르는 시간대를 메워 준다.
#   - refresh.yml 에도 같은 스텝이 붙어 있다(워커가 평일 매시간·주말 4시간마다 부름).
# 둘이 겹쳐 떠도 fetch_screens.py 가 '직전 수집이 45분 안이면 건너뜀'으로 스스로 거른다.
#
# 주기는 스크립트가 정한다 — 개봉 후 30일까지 1시간, 그 뒤 4시간.

on:
  schedule:
    # 8시간마다(UTC 00·08·16 = KST 09·17·01).
    #
    # 원래 매시간이었다. 그런데 비공개 저장소라 Actions 분이 과금되는데,
    # 회당 2~3분 x 24회 = 월 2,160분이면 무료 한도 2,000분을 이것 하나로 넘긴다.
    # (게다가 매시간 cron 은 이 저장소에서 거의 발화하지 않아 7일간 1회만 돌았다 —
    #  '시간별 추적'은 실제로 작동한 적이 없다.)
    # 다른 워크플로 몫을 남기면 8시간이 상한이다. 더 촘촘히 보려면 저장소를
    # 공개로 돌리거나(Actions 무제한 무료) Actions 요금제를 올려야 한다.
    - cron: "5 */8 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "전 날짜 전수 조사(느림). 비우면 가까운 날짜만"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # public/index.html 을 쓰는 워크플로는 한 그룹으로 묶어 동시 실행을 막는다.
  # 따로 두면 커밋 단계에서 리베이스 충돌로 죽는다(실측 실패율 15%).
  group: repo-write
  cancel-in-progress: false

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 스크린 배정·예매 수집
        run: |
          if [ -n "${{ github.event.inputs.full }}" ]; then
            python fetch_screens.py --force || echo "스크린 추적 건너뜀"
          else
            python fetch_screens.py --hot || echo "스크린 추적 건너뜀"
          fi

      # 수집이 막히거나 굳으면 별도 메시지로 알린다(데일리 레터와 섞지 않는다).
      # 정상이면 아무것도 보내지 않는다. 상태파일이 있어야 같은 걸 반복해서 안 쏜다.
      - name: 건강검진 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watchdog.py || echo "건강검진 건너뜀"

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html archive health.json watchdog_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"; exit 0
          fi
          # 한밤(KST 01시) 회차는 Cloudflare 빌드를 건너뛴다 — 어차피 볼 사람이 없고
          # 무료 한도가 월 500 빌드다. 다음 회차(09시)가 이 데이터까지 같이 배포한다.
          h=$(TZ=Asia/Seoul date +%H)
          case "$h" in 09|17) SKIP="" ;; *) SKIP=" [CI Skip]" ;; esac
          git commit -m "스크린·예매 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')${SKIP}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "푸시 밀림 - 재시도 $i"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "리베이스 충돌 - 이번 회차 커밋 포기(다음 실행이 재수집)"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "푸시 5회 실패"; exit 1
