# 산업부 '주요 유통업체 매출 동향' 자동 수집 — fetch_retail.py → const RETAIL (2026-11-11 신설)
#
# 공표 = 조사기준월 익월 말 · 2026 실측 전부 수요일 11:00(3/25·5/27·6/24·7/29·8/26·9/23·10/28). 10월치는 11/25(수) 유력.
# 매월 20~31일 KST 11:13~19:13 매시 게시판 1쪽을 본다(요청 1건 · 게시 전이면 바로 끝).
# 새 달이 들어가면 커밋 메시지 '…유통업체 매출동향…' + 배포 → 끝나면 retail_report.yml(텔레그램)이 workflow_run 으로 깨어난다.
# fetch_retail.py 를 고쳐 push 하면 9월치로 파싱·대조만 한다(러너가 산업부 게시판에 닿는지 확인 겸).
name: 유통업체 매출동향 수집

on:
  schedule:
    - cron: "13 2-10 1-3,20-31 * *"   # UTC 02~10시 = KST 11~19시 · 다음 달 1~3일은 늦게 나올 때 대비
  push:
    branches: [main]
    paths: ["fetch_retail.py", ".github/workflows/retail.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  retail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pdfplumber

      - name: 시험(9월치 파싱·대조만)
        if: github.event_name == 'push'
        run: python fetch_retail.py --ym 26.09 --check

      - name: 산업부 유통업체 매출동향
        if: github.event_name != 'push'
        run: |
          rc=0; python fetch_retail.py || rc=$?
          echo "종료코드 $rc"
          [ "$rc" = "3" ] && exit 1      # 게시판에 못 닿음 — 실패로 남겨 alert.yml 이 알린다
          exit 0

      - name: 변경분 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/index.html health.json; then
            echo "변경 없음 - 커밋 생략"; exit 0
          fi
          YM=$(python -c "import retail_ingest as R;b,_=R.load_block(open(R.HTML,encoding='utf-8').read());print(b['latest'])")
          git add public/index.html health.json 2>/dev/null || true
          if git diff --cached --quiet -- public/index.html; then
            git commit -m "유통업체 매출 수집 기록 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST') [CI Skip]"
          else
            git commit -m "산업부 유통업체 매출동향 ${YM} 자동 수집 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          fi
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "푸시 밀림 - 재시도 $i"
            git fetch origin main
            if ! git rebase origin/main; then
              if python merge_blocks.py && GIT_EDITOR=true git rebase --continue; then
                sleep $((i * 3)); continue
              fi
              git rebase --abort || true
              echo "리베이스 충돌 - 이번 회차 커밋 포기(다음 실행이 재수집)"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "푸시 5회 실패"; exit 1
