name: 아침 데이터 수집

# 2026-08-07: '05시 수집 → 06시 레터' 로 분리했다.
#   이 워크플로는 '수집만' 한다(레터는 letter.yml). 매일 새로 받아야 하는 걸 전부 여기서
#   받고 커밋해 두면, 한 시간 뒤 letter.yml 이 그 신선한 데이터로 레터를 보낸다.
#   트렌드도 여기서 '전체(네이버·구글·얀덱스)' 를 받는다 — 예전엔 레터를 안 늦추려 네이버만
#   받고 구글·얀덱스는 주 1회였는데, 이제 수집이 레터보다 1시간 앞서 도니 전체를 받아도 된다.
#
# 트리거: Cloudflare 워커(KST 05:00, 정시성) + GitHub cron(백업, 밀릴 수 있음).
on:
  schedule:
    - cron: "0 20 * * 0-4"     # KST 평일 05:00 (백업). 정시성은 워커가 담당.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # public/index.html 을 쓰는 워크플로는 한 그룹으로 묶어 동시 실행을 막는다.
  group: repo-write
  cancel-in-progress: false

jobs:
  # 워커(05:00)와 GitHub cron(05:00 백업)이 둘 다 부를 수 있다. 백업 cron 회차는
  # '오늘 수집이 이미 돌았으면' 여기서 끝낸다 — 같은 데이터를 두 번 받지 않게(특히 구글 429).
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25
      - id: c
        run: |
          go=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            t=$(TZ=Asia/Seoul date +'%Y-%m-%d')
            if git log -25 --pretty=%s | grep -q "이벤트/수출 갱신 $t"; then
              go=0; echo "오늘($t) 수집이 이미 돌았습니다 - 백업 cron 회차는 여기서 끝냅니다."
            else
              echo "오늘 수집 기록이 없습니다 - 진행합니다."
            fi
          fi
          echo "go=$go" >> $GITHUB_OUTPUT

  collect:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    # 06시 레터 전에 끝나야 한다. 스텝마다 상한 + 전체 30분 컷.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 트렌드 전체 수집에 필요(구글=trendspy, 얀덱스/네이버=requests). 다른 수집기는 stdlib.
      - name: 트렌드 의존성
        run: pip install --quiet requests trendspy

      - name: DART 공시 수집
        continue-on-error: true
        timeout-minutes: 6
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then echo "DART_API_KEY 시크릿 없음"; exit 1; fi
          python fetch_events.py

      # 종목 뉴스 — **레터 직전에 한 번 더 받는다** (2026-08-09 추가).
      #
      # 여기 없던 게 '아침 레터에 뉴스가 안 온다' 의 원인이었다. 뉴스는 refresh.yml 이
      # 짝수 시(08~18)에만 받으므로, 06시 레터가 싣는 뉴스는 **늘 전날 18시 것**이었다.
      # 밤사이·새벽 기사가 통째로 빠진 채 나갔다는 뜻이다.
      #
      # 이 워크플로는 05시에 돌고 레터(letter.yml)가 그 완료를 듣고 뜨므로,
      # 여기서 받으면 레터가 그날 아침 기사를 싣는다.
      # 네이버 요청량은 하루 1회분만 는다(refresh 쪽 짝수 시 수집은 그대로).
      - name: 종목 뉴스 수집
        continue-on-error: true
        timeout-minutes: 6
        run: python runstep.py "종목 뉴스" fetch_news.py

      # Steam 동접·리뷰(키 불필요). 매일 아침 1점씩 쌓아 게임 커버 종목의 실측 신호를 만든다.
      - name: Steam 동접·리뷰 수집
        continue-on-error: true
        timeout-minutes: 4
        run: python runstep.py "Steam" fetch_steam.py

      # YouTube 채널 통계(엔터 IP). YOUTUBE_API_KEY 시크릿 있어야 동작, 없으면 조용히 스킵.
      - name: YouTube 채널 통계 수집
        continue-on-error: true
        timeout-minutes: 4
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python runstep.py "YouTube" fetch_youtube.py

      # Spotify 아티스트 인기도·팔로워(엔터). 크레덴셜 있어야 동작, 없으면 스킵.
      - name: Spotify 아티스트 수집
        continue-on-error: true
        timeout-minutes: 5
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python runstep.py "Spotify" fetch_spotify.py

      # 애플 앱스토어 게임 매출/무료 순위(게임 IP). 마케팅 RSS, 키 불필요.
      - name: 앱스토어 게임순위 수집
        continue-on-error: true
        timeout-minutes: 3
        run: python runstep.py "앱스토어" fetch_appstore.py

      # 방한 외래관광객 월별(호텔/면세/카지노). 한국관광 데이터랩 내부 JSON, 키 불필요.
      - name: 방한 외래관광객 수집
        continue-on-error: true
        timeout-minutes: 3
        run: python runstep.py "방한관광" fetch_tourism.py

      # 영화 예매·박스오피스(KOBIS). movie.yml 은 워커가 안 불러서 여기 매일 붙인다.
      - name: 영화 예매·박스오피스 수집
        continue-on-error: true
        timeout-minutes: 12
        env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
        run: python runstep.py "영화 예매" fetch_movie.py

      # 써클차트 앨범 판매량(월간·주간) — 엔터 종목의 실물 수요/매출 신호. 키 불필요.
      - name: 써클차트 앨범판매 수집
        continue-on-error: true
        timeout-minutes: 4
        run: python runstep.py "써클차트" fetch_circle.py

      # 탑툰챗(탑코미디어 AI 챗봇) — 캐릭터별 누적 대화수를 하루 1점씩 찍어 일별 증분을 만든다.
      # 매일 같은 시각에 받아야 증분이 깔끔하므로 아침 수집에만 둔다. 키 불필요.
      - name: 탑툰챗 대화수 수집
        continue-on-error: true
        timeout-minutes: 4
        run: python runstep.py "탑툰챗" fetch_toptoonchat.py

      # AI 캐릭터 챗봇 앱 순위(애플 RSS, 키 불필요) — 탑툰챗 경쟁 지형 + 탑툰 본체 앱.
      # '크랙'은 검색어가 소프트웨어 크랙과 겹쳐 오염되므로 추이는 여기(매출순위)로 본다.
      - name: AI챗 앱순위 수집
        continue-on-error: true
        timeout-minutes: 3
        run: python runstep.py "AI챗 앱순위" fetch_aichat.py

      # 트렌드 전체(네이버·구글·얀덱스). 06시 레터 前에 다 받는다.
      # 구글은 429 로 자주 막히지만 fetch_trends 가 막힌 출처는 기존값을 보존한다(데이터 손실 없음).
      - name: 트렌드 전체 갱신 (네이버·구글·얀덱스)
        continue-on-error: true
        timeout-minutes: 15
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: python runstep.py "트렌드" fetch_trends.py

      # 수출입(관세청) — 10~26일에 매일 확인, fetch_trade 가 새 월/현행화 있을 때만 파일 변경.
      - name: 월간 수출 갱신 (10~26일)
        continue-on-error: true
        timeout-minutes: 6
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          d=$(TZ=Asia/Seoul date +%d)
          if [ "$d" -ge 10 ] && [ "$d" -le 26 ] && [ -n "$DATA_GO_KR_KEY" ]; then
            python runstep.py "수출입" fetch_trade.py
          else
            echo "수출 확인 구간 아님 - 생략"
          fi

      - name: 변경분 커밋
        if: always()
        timeout-minutes: 5
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # health.json 을 빼면 runstep 이 남긴 실패 기록이 원격에 안 올라간다.
          # 그래서 탑툰챗이 8/31~9/1 내내 죽어 있었는데 watchdog 도 나도 이유를 못 봤다.
          # (refresh.yml·screens.yml 은 이미 커밋하고 있었다 — 여기만 빠져 있었다.)
          git add public/index.html spotify_debug.json archive health.json watchdog_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "이벤트/수출 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "푸시 밀림 - 재시도 $i"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo '리베이스 충돌 - 이번 회차 커밋 포기(다음 실행이 재수집)'; break
              fi
              sleep $((i * 3))
            done
          fi
