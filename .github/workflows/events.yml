name: 아침 데이터 수집

# 2026-08-07: '05시 수집 → 06시 레터' 로 분리했다.
#   이 워크플로는 '수집만' 한다(레터는 letter.yml 이 workflow_run 으로 뒤따른다). 매일 새로
#   받아야 하는 걸 전부 여기서 받고 커밋해 두면 letter.yml 이 그 신선한 데이터로 레터를 보낸다.
#
# 2026-09-24 정비 (개편계획.md Phase 0):
#   · 수집기가 20개로 늘어 회당 32~35분인데 timeout 이 30분이라 9/15 부터 매일 마지막 스텝
#     (컴투스 모델·월간 수출)이 잘렸다 → 55분.
#   · 게이트가 schedule 회차만 걸러서 워커(05:00)와 PC(05:35)가 **매일 같은 수집을 두 번** 했다
#     → 트리거와 무관하게 '오늘 수집이 이미 돌았으면 종료'. 수동 강제는 force 입력.
#   · 순서: 레터에 꼭 필요한 것(DART·뉴스·트렌드·앱순위·엔터·게임 일간)을 앞에, 느리고 선택적인
#     것(스토어 순위·게임비트·채용·KT&G)을 뒤에. 잘리더라도 앞이 남는다.
#
# 트리거: Cloudflare 워커(KST 05:00, 정시성) + PC 작업 스케줄러(05:35, 백업) + GitHub cron(백업, 밀림).
# 어느 쪽이 먼저 오든 첫 회차만 실제로 돌고 나머지는 게이트에서 10초 안에 끝난다.
on:
  schedule:
    - cron: "0 20 * * 0-4"     # KST 평일 05:00 (백업). 정시성은 워커가 담당.
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 돌았어도 다시 돌릴까요? (아무 값이나 넣으면 강제)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # public/index.html 을 쓰는 워크플로는 한 그룹으로 묶어 동시 실행을 막는다.
  # 05:00 회차가 도는 중에 05:35 회차가 오면 여기서 기다렸다가, 게이트에서 앞 회차의 커밋을 보고 끝난다.
  group: repo-write
  cancel-in-progress: false

jobs:
  # 오늘 수집이 이미 돌았으면(커밋이 있거나, 5분 넘게 돈 성공 회차가 3시간 안에 있으면) 여기서 끝낸다.
  # 구글 트렌드 429 를 두 배로 부르지 않기 위해서다. 수동 force 만 예외.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          go=1
          t=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          if [ -n "$FORCE" ]; then
            echo "수동 강제 실행 - 게이트 통과"
          else
            if git log -40 --pretty=%s | grep -q "이벤트/수출 갱신 $t"; then
              go=0; echo "오늘($t) 수집 커밋이 이미 있습니다 - 이 회차는 여기서 끝냅니다."
            else
              # 커밋 없이 끝난 성공 회차(변경 없음)나 지금 도는 회차도 '이미 돌았다'로 본다.
              since=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
              n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/workflows/events.yml/runs?per_page=15" \
                | jq --arg me "$RUN_ID" --arg since "$since" \
                  '[.workflow_runs[] | select((.id|tostring)!=$me) | select(.created_at>$since)
                    | select(.status=="in_progress" or .status=="queued"
                        or (.status=="completed" and .conclusion=="success"
                            and ((.updated_at|fromdateiso8601)-(.created_at|fromdateiso8601))>300))] | length' 2>/dev/null || echo 0)
              if [ "${n:-0}" -gt 0 ]; then
                go=0; echo "3시간 안에 실제 수집 회차가 ${n}건(진행 중 포함) - 이 회차는 여기서 끝냅니다."
              else
                echo "오늘 수집 기록이 없습니다 - 진행합니다."
              fi
            fi
          fi
          echo "go=$go" >> $GITHUB_OUTPUT

  collect:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    # 실측 32~35분(2026-09-23). 스텝마다 상한 + 전체 55분 컷. 06:00 안에 끝난다.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 트렌드 전체 수집에 필요(구글=trendspy, 얀덱스/네이버=requests). 다른 수집기는 stdlib.
      - name: 트렌드 의존성
        run: pip install --quiet requests trendspy

      # ── 1부: 레터·아침 화면에 꼭 필요한 것 ──────────────────────────────────

      - name: DART 공시 수집
        continue-on-error: true
        timeout-minutes: 6
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then echo "DART_API_KEY 시크릿 없음"; exit 1; fi
          python fetch_events.py

      # 종목 뉴스 — 레터 직전에 한 번 더 받는다 (2026-08-09). 여기 없으면 06시 레터가 전날 18시 뉴스를 싣는다.
      - name: 종목 뉴스 수집
        continue-on-error: true
        timeout-minutes: 6
        run: python runstep.py "종목 뉴스" fetch_news.py

      # 트렌드 전체(네이버·구글·얀덱스). 회당 8~10분. 구글 429 는 fetch_trends 가 기존값을 보존한다.
      # ⚠ 네이버 데이터랩 전일치는 KST 10시경에 열린다 — 여기선 그제까지, 어제치는 refresh.yml 10시 회차가 붙인다.
      - name: 트렌드 전체 갱신 (네이버·구글·얀덱스)
        continue-on-error: true
        timeout-minutes: 15
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: python runstep.py "트렌드" fetch_trends.py

      # 앱 매출순위(애플·구글 × KR·US·JP·TW). 게임 종목 일간 신호.
      - name: 앱스토어 게임순위 수집
        continue-on-error: true
        timeout-minutes: 3
        run: python runstep.py "앱스토어" fetch_appstore.py

      # Spotify 아티스트(엔터). 크레덴셜 있어야 동작, 없으면 스킵.
      - name: Spotify 아티스트 수집
        continue-on-error: true
        timeout-minutes: 5
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python runstep.py "Spotify" fetch_spotify.py

      # YouTube 채널 통계(엔터 IP). YOUTUBE_API_KEY 시크릿 있어야 동작, 없으면 조용히 스킵.
      - name: YouTube 채널 통계 수집
        continue-on-error: true
        timeout-minutes: 4
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python runstep.py "YouTube" fetch_youtube.py

      # 방한 외래관광객 월별(호텔/면세/카지노). 한국관광 데이터랩 내부 JSON, 키 불필요.
      - name: 방한 외래관광객 수집
        continue-on-error: true
        timeout-minutes: 3
        run: python runstep.py "방한관광" fetch_tourism.py

      # 써클차트 앨범 판매량(월간·주간) — 엔터 실물 수요. 키 불필요.
      - name: 써클차트 앨범판매 수집
        continue-on-error: true
        timeout-minutes: 4
        run: python runstep.py "써클차트" fetch_circle.py

      # 탑툰챗 — 매일 같은 시각에 받아야 증분이 깔끔하므로 아침 수집에만 둔다. 키 불필요.
      - name: 탑툰챗 대화수 수집
        continue-on-error: true
        timeout-minutes: 4
        run: python runstep.py "탑툰챗" fetch_toptoonchat.py

      # 게임머니 시세(아이템매니아). 하루 9요청. 오후 재시도는 refresh.yml.
      - name: 게임머니 시세 수집
        continue-on-error: true
        timeout-minutes: 4
        run: python runstep.py "게임머니" fetch_gamemoney.py

      # 디시 갤러리 글 양 — 글번호 차분. 하루 갤당 1요청.
      - name: 디시 글수 수집
        continue-on-error: true
        timeout-minutes: 4
        run: python runstep.py "디시 글수" fetch_dc.py

      # 올리브영 베스트 100 — 화장품 국내 채널. ⚠ collector_health.ua(doc=True) 라야 200. 재시도는 refresh.yml.
      - name: 올리브영 베스트 수집
        continue-on-error: true
        timeout-minutes: 3
        run: python runstep.py "올리브영" fetch_beauty.py

      # Qoo10 JP 뷰티 베스트셀러 톱200 — 일본 K뷰티 주 채널(사용자 지시 2026-09-24). 요청 1건 · 러너에서 200(diag 확인).
      - name: Qoo10 JP 뷰티 톱200 수집
        continue-on-error: true
        timeout-minutes: 3
        run: python runstep.py "Qoo10" fetch_qoo10.py

      # 지금 화제 — 구글 트렌드·네이트·나무위키·디시 흥한 마이너갤. 요청 4건.
      - name: 지금 화제 수집
        continue-on-error: true
        timeout-minutes: 3
        run: python runstep.py "버즈" fetch_buzz.py

      # AI 캐릭터 챗봇 앱 순위(애플 RSS) — 탑툰챗 경쟁 지형.
      - name: AI챗 앱순위 수집
        continue-on-error: true
        timeout-minutes: 3
        run: python runstep.py "AI챗 앱순위" fetch_aichat.py

      # 컴투스 매출 모델 재료(DART 분기실적 + 네이버 월별 검색). 값이 그대로면 파일을 안 건드린다.
      - name: 컴투스 매출 모델 재료
        continue-on-error: true
        timeout-minutes: 5
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python runstep.py "컴투스 모델" fetch_c2model.py

      # 수출입(관세청) — 10~26일에 매일 확인, fetch_trade 가 새 월/현행화 있을 때만 파일 변경.
      # 9/15~9/23 은 30분 컷에 잘려 한 번도 못 돌았다 — 그래서 앞으로 당겼다.
      - name: 월간 수출 갱신 (10~26일)
        continue-on-error: true
        timeout-minutes: 6
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          d=$(TZ=Asia/Seoul date +%d)
          if [ "$d" -ge 10 ] && [ "$d" -le 26 ] && [ -n "$DATA_GO_KR_KEY" ]; then
            python runstep.py "수출입" fetch_trade.py
          else
            echo "수출 확인 구간 아님 - 생략"
          fi

      # ── 2부: 느리거나 선택적인 것 — 잘려도 1부는 남는다 ──────────────────────

      # 스토어 판매·예약 순위(PS·Steam·MS 스토어). 회당 ~2분. PS 는 persisted query 해시라 깨질 수 있다.
      - name: 스토어 판매·예약 순위 수집
        continue-on-error: true
        timeout-minutes: 6
        run: python runstep.py "스토어 순위" fetch_storerank.py

      # 게임비트 쌀먹 거래대금 — 하루 ~130요청, 회당 ~5분.
      - name: 게임비트 거래대금 수집
        continue-on-error: true
        timeout-minutes: 7
        run: python runstep.py "게임비트" fetch_gamebit.py

      # 채용 공고(사람인) — 40종목 × 1~2요청, 회당 ~5분. 회사명 정확일치.
      - name: 채용 공고 수집
        continue-on-error: true
        timeout-minutes: 7
        run: python runstep.py "채용공고" fetch_jobs.py

      # KT&G 유라시아 — 관세청·Elitalco·Kaspi·hh.kz. 회당 1~2분.
      - name: KT&G 유라시아 수집
        continue-on-error: true
        timeout-minutes: 6
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python runstep.py "KT&G 유라시아" fetch_ktg.py

      # Steam 은 여기 있으면 안 된다 → refresh.yml(KST 09시 이후). 05시 = UTC 20시라 어제 UTC 가 아직 '진행 중'이다.
      # 영화(KOBIS)는 2026-09-21 수집 중단 — 되살리는 법은 영화수집_방식.md.

      - name: 변경분 커밋
        if: always()
        timeout-minutes: 5
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # health.json 을 빼면 runstep 이 남긴 실패 기록이 원격에 안 올라간다.
          git add public/index.html spotify_debug.json archive health.json watchdog_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "이벤트/수출 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "푸시 밀림 - 재시도 $i"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo '리베이스 충돌 - 이번 회차 커밋 포기(다음 실행이 재수집)'; break
              fi
              sleep $((i * 3))
            done
          fi
