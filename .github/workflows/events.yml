name: 아침 데이터 갱신 + 데일리 레터

on:
  # 트리거는 Cloudflare 워커(평일 KST 07:00 에 workflow_dispatch). GitHub 자체 cron 은 이 저장소에서
  # 발화 시각이 불규칙(08:01·10:56 등)해 정시 발송엔 안 쓴다. 수집·발송을 한 번에 처리한다.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: DART 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then echo "DART_API_KEY 시크릿 없음"; exit 1; fi
          python fetch_events.py

      # Steam 동접·리뷰(키 불필요). 매일 아침 1점씩 쌓아 게임 커버 종목의 실측 신호를 만든다.
      - name: Steam 동접·리뷰 수집
        run: python fetch_steam.py || echo "Steam 수집 실패(계속 진행)"

      # YouTube 채널 통계(엔터 IP). YOUTUBE_API_KEY 시크릿 있어야 동작, 없으면 조용히 스킵.
      - name: YouTube 채널 통계 수집
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_youtube.py || echo "YouTube 수집 건너뜀"

      # Spotify 아티스트 인기도·팔로워(엔터). 크레덴셜 있어야 동작, 없으면 스킵.
      - name: Spotify 아티스트 수집
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python fetch_spotify.py || echo "Spotify 수집 건너뜀"

      # 방한 외래관광객 월별(호텔/면세/카지노). 한국관광 데이터랩 내부 JSON, 키 불필요.
      # (미국 러너에서 지역차단되면 실패해도 기존 데이터 보존)
      - name: 방한 외래관광객 수집
        run: python fetch_tourism.py || echo "관광 수집 건너뜀"

      # 영화 예매·박스오피스(KOBIS). movie.yml 은 워커가 안 불러서 여기 매일 붙인다.
      # 개봉 전엔 예매(예매율·예매수)를 일별 누적, 개봉 후엔 일별 관객수까지 자동으로 쌓인다.
      - name: 영화 예매·박스오피스 수집
        env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
        run: python fetch_movie.py || echo "영화 수집 건너뜀"

      # 써클차트 앨범 판매량(월간·주간) — 엔터 종목의 실물 수요/매출 신호. 키 불필요.
      # (한국 사이트라 미국 러너에서 지역차단되면 실패해도 기존 데이터 보존)
      - name: 써클차트 앨범판매 수집
        run: python fetch_circle.py || echo "써클 수집 건너뜀"

      # 수출입(관세청)은 발표 시점이 고정(월 단위)이라 데일리에서 뺐다 → trade.yml(매월 5·20일)이 전담.

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/index.html; then
            echo "변경 없음 - 커밋 생략"
          else
            git add public/index.html
            git commit -m "이벤트/수출 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase
            git push
          fi

      # 수집 직후 데일리 레터 발송(한 번에). 월간 수출 레터는 trade.yml(5·20일)이 별도 담당.
      - name: 데일리 레터 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python digest.py || echo "데일리 레터 건너뜀"
