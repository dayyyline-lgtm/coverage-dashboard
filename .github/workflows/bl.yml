# 미국 해상 수입 B/L 월별 선적량(ImportYeti) — fetch_bl.py → const BL (2026-10-24 신설)
#
# ImportYeti 는 로그인 없이 한 IP 에서 20여 장을 넘게 열면 빈 화면을 준다. 러너는 회차마다 IP 가 바뀌어
# 한 번에 소스 전부(--all)를 받는다 — 막히면 fetch_bl 이 그 자리에서 멈추고, 남은 소스는 다음 회차가 오래된 순으로 잇는다.
# 월별 자료라 하루 한 번이면 충분하다. 배포는 하지 않는다(CI 스킵 표시 — 다음 배포가 같이 싣는다).
name: bl

on:
  schedule:
    - cron: "40 22 * * *"           # UTC 22:40 = KST 07:40 (아침 수집·레터와 안 겹치게)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  bl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 미국 B/L 선적(ImportYeti)
        run: python runstep.py "B/L 선적" fetch_bl.py --all

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/index.html health.json watchdog_state.json; then
            echo "변경 없음 - 커밋 생략"; exit 0
          fi
          git add public/index.html health.json watchdog_state.json 2>/dev/null || true
          git commit -m "미국 B/L 선적 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST') [CI Skip]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "푸시 밀림 - 재시도 $i"
            git fetch origin main
            if ! git rebase origin/main; then
              if python merge_blocks.py && GIT_EDITOR=true git rebase --continue; then
                sleep $((i * 3)); continue
              fi
              git rebase --abort || true
              echo "리베이스 충돌 - 이번 회차 커밋 포기(다음 실행이 재수집)"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "푸시 5회 실패"; exit 1
