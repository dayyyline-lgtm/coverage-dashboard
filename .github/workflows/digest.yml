name: 텔레그램 데일리 레터 (수동)

# 정시 발송은 events.yml(워커가 평일 07:00 트리거)이 수집 직후에 한다.
# 이 워크플로는 '지금 당장' 다시 받아보고 싶을 때 수동 실행용.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "digest · alerts · dry · trade(수출 속보) · trade-dry"
        default: "digest"

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 다이제스트 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            alerts) python digest.py --alerts ;;
            # 발송 없이 본문만 로그에 찍는다(정렬 디버깅용).
            dry)    python digest.py --dry-run ;;
            # 수출 속보 — 확정치보다 2주 빠른 잠정 집계. 상태파일과 무관하게 보낸다.
            trade)      python trade_digest.py --flash --force ;;
            trade-dry)  python trade_digest.py --flash --dry-run ;;
            *)      python digest.py ;;
          esac
      # 월간 수출 레터는 trade.yml(매월 5·20일 수집)이 발송까지 담당한다 — 데일리와 분리.
