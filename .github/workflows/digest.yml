name: 텔레그램 데일리 레터 (수동)

# 데일리 레터는 평소 events.yml(워커가 매일 트리거)이 자동 발송한다.
# 이 워크플로는 '지금 당장' 받아보고 싶을 때 수동으로 돌리는 용도.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "digest(전체) 또는 alerts(짧게)"
        default: "digest"

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 다이제스트 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "alerts" ]; then
            python digest.py --alerts
          else
            python digest.py
          fi
