name: 텔레그램 데일리 레터 (수동)

# 데일리 레터는 평소 events.yml(워커가 매일 트리거)이 자동 발송한다.
# 이 워크플로는 '지금 당장' 받아보고 싶을 때 수동으로 돌리는 용도.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "digest(전체) · alerts(짧게) · dry(발송 없이 본문만 출력)"
        default: "digest"

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 다이제스트 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            alerts) python digest.py --alerts ;;
            # 발송 없이 본문만 로그에 찍는다. 정렬이 어긋날 때 실제로 나가는
            # 문자열을 그대로 봐야 원인을 잡을 수 있다(눈으로 캡처만 보면 못 잡는다).
            dry)    python digest.py --dry-run ;;
            *)      python digest.py ;;
          esac
