# 수집 마켓. node 는 /gp/bestsellers/ 뒤에 붙는 경로 (마켓마다 노드ID가 다르다).
markets:
  - code: US
    domain: www.amazon.com
    currency: USD
    lang: "en-US,en;q=0.9"
    enabled: true
    categories:
      - {label: Beauty, node: beauty, top_n: 100}
  - code: UK
    domain: www.amazon.co.uk
    currency: GBP
    lang: "en-GB,en;q=0.9"
    enabled: true
    categories:
      - {label: Beauty, node: beauty, top_n: 50}
  - code: DE
    domain: www.amazon.de
    currency: EUR
    lang: "de-DE,de;q=0.9"
    enabled: true
    categories:
      - {label: Beauty, node: beauty, top_n: 50}
  - code: FR
    domain: www.amazon.fr
    currency: EUR
    lang: "fr-FR,fr;q=0.9"
    enabled: true
    categories:
      - {label: Beauty, node: beauty, top_n: 50}
  - code: IT
    domain: www.amazon.it
    currency: EUR
    lang: "it-IT,it;q=0.9"
    enabled: true
    categories:
      - {label: Beauty, node: beauty, top_n: 50}
  - code: ES
    domain: www.amazon.es
    currency: EUR
    lang: "es-ES,es;q=0.9"
    enabled: true
    categories:
      - {label: Beauty, node: beauty, top_n: 50}

# --- 실질 추적의 핵심 ---
# 한 번이라도 관심 브랜드로 잡힌 ASIN은 data/tracked_asins.json 에 고정된다.
# 그 뒤로는 베스트셀러 100위 밖으로 밀려나도 매일 BSR(판매순위)을 재므로 추이가
# 안 끊긴다. 리스트 스크래핑만 하면 순위권 이탈 = 데이터 소실이다.
tracking:
  weekday_list_only: true   # 평일엔 베스트셀러 리스트만. /dp/ 정밀측정은 주간 집계일에.
                            # 리스트는 요청 7건인데 /dp/ 는 ASIN 마다 한 번씩이라
                            # 요청의 대부분을 차지하고 CAPTCHA 도 거기서 난다.
  # 추적 ASIN 전부를 며칠에 한 바퀴 돌며 잴 것인가. 0 이면 회전 안 함(옛 동작).
  # 매 회차 ceil(마켓 추적수 / 주기) 개를 '가장 오래 안 잰 것부터' 고른다.
  rotation_cycle_days: 7
  weekday_detail_budget: 120 # 평일 /dp/ 예산(마켓당) — 회전 몫 + 상위 가중치 몫
                            # 이게 0 이면 새로 진입한 제품의 브랜드를 못 가린다.
  max_detail_per_run: 160   # 마켓당 1회 실행 상세조회 상한 (초과분은 다음 실행에서)
  retire_after_days: 30     # 이 기간 내내 BSR도 안 잡히면 추적 해제 (단종 대응)

# 브랜드 검색 — 카탈로그 전체 발견용.
# 베스트셀러 리스트는 top100만 보여줘서, 매출이 여러 제품에 퍼진 브랜드가 과소평가된다.
# 실측: COSRX 미국은 리스트에 1개뿐인데 검색으로는 110개가 나온다(연 86억 -> 321억).
search:
  enabled: true
  weekly_only: true         # 평일엔 생략, 주간 집계일에만 (차단 회피)
  max_pages: 2              # 브랜드당 검색 페이지 수 (1페이지 = 48개)
  brands: auto              # auto = 한 번이라도 잡힌 브랜드만 검색 (미진입 대기군은 생략)
  delay: [4.0, 7.0]

detail:
  top_per_brand: 5          # 브랜드당 최소 몇 개를 /dp/ 로 정밀 측정할지.
                            # 브랜드별로 나눠야 큰 브랜드가 예산을 독식하지 않는다
  top_per_market: 35        # 마켓당 /dp/ 총 상한 (평일)
  # 주간 집계일에는 깊게 판다. **주간 판매량 배지는 상품 상세에만 있고
  # 검색 결과에는 없어서**, 이 날 조회한 만큼이 그 주 커버리지가 된다.
  top_per_market_weekly: 120
  top_per_brand_weekly: 12
  delay: [3.0, 6.0]         # 상세 조회 사이 대기 (초, 랜덤)

page_delay: [4.0, 7.0]
market_gap: [60, 90]        # 마켓 갈아탈 때 휴식(초). 막힌 마켓 뒤엔 3배      # 리스트 페이지 사이 대기 (초, 랜덤)
retry_failed_markets: 1     # 막힌 마켓을 전 마켓 순회 뒤 한 번 더 (0=안 함)
retry_cooldown: [180, 300]  # 재시도 전 냉각(초)
impersonate: chrome131         # curl_cffi TLS 지문. 막히면 chrome131 등으로 고정

report:
  mode: daily               # daily   = 국가별 top100 SKU 수 + 신규 편입/이탈만 (기본, 짧다)
                            # detail  = 국가별 제품 전부 + 브랜드 총합 (길다)
                            # compact = 브랜드x국가 매트릭스만

# 주간 집계 — 아마존 주간 배지는 '최근 7일' 롤링이라 주 1회만 찍어야
# 관측 구간이 안 겹치고 그대로 누적된다. 매일 찍어 더하면 같은 판매를 7번 센다.
weekly:
  weekday: 6                # 0=월 ... 6=일. 이 요일에만 weekly.csv 에 적는다
  products_per_brand: 6     # 국가별 섹션에서 브랜드당 보여줄 제품 수
  move_threshold: 20        # BSR이 이 % 이상 움직이면 변동 항목으로 표시
  max_moves: 6              # 상승·하락 각각 최대 몇 줄까지 보여줄지

telegram:
  enabled: true
  # 토큰은 여기가 아니라 secrets_local.py 에 넣으세요 (이 파일은 커밋 대상입니다).
  bot_token: ""
  chat_id: ""

data_dir: "data"

git:
  enabled: true
