# ===== 아마존 K뷰티 베스트셀러 트래커 설정 =====
# 이 파일을 config.yaml로 복사해서 쓰세요 (config.yaml은 gitignore 대상).

# 추적 브랜드. 제목에 이 문자열이 **단어 단위로** 들어가면 매칭된다
# (부분일치가 아니라 단어경계 매칭이라 'Anua'가 'manual'에 안 걸린다).
#
# 2026-08-02 전수조사 기준 실제 진입 = ★. 나머지는 진입하면 🆕로 알려주는 대기군이고
# 목록에 둬도 비용이 0이다(제목 매칭은 공짜). 지우지 말 것.
