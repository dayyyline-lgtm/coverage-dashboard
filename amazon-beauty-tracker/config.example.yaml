# --- 실질 추적의 핵심 ---
# 한 번이라도 관심 브랜드로 잡힌 ASIN은 data/tracked_asins.json 에 고정된다.
# 그 뒤로는 베스트셀러 100위 밖으로 밀려나도 매일 BSR(판매순위)을 재므로 추이가
# 안 끊긴다. 리스트 스크래핑만 하면 순위권 이탈 = 데이터 소실이다.
tracking:
  max_detail_per_run: 160   # 마켓당 1회 실행 상세조회 상한 (초과분은 다음 실행에서)
  retire_after_days: 30     # 이 기간 내내 BSR도 안 잡히면 추적 해제 (단종 대응)

detail:
  delay: [1.5, 3.0]         # 상세 조회 사이 대기 (초, 랜덤)

page_delay: [2.0, 4.0]      # 리스트 페이지 사이 대기 (초, 랜덤)
impersonate: chrome         # curl_cffi TLS 지문. 막히면 chrome131 등으로 고정

report:
  mode: compact             # compact = 브랜드x국가 매트릭스 + 변동만 (한 화면)
                            # full    = 제품별 전부 나열 (길다)
  move_threshold: 20        # BSR이 이 % 이상 움직이면 변동 항목으로 표시
  max_moves: 6              # 상승·하락 각각 최대 몇 줄까지 보여줄지

telegram:
  enabled: true
  # 토큰은 여기가 아니라 secrets_local.py 에 넣으세요 (이 파일은 커밋 대상입니다).
  bot_token: ""
  chat_id: ""

data_dir: "data"

git:
  enabled: true
