  - Beauty of Joseon    # ★ 구다이글로벌 — UK/DE
  - Anua                # ★ 더파운더즈(IPO 준비) — US/DE
  - Melaxin             # ★ 닥터멜락신(비상장) — US/DE
  - Purito              # ★ 퓨리토 — DE
  - Coreana             # ★ 코리아나 027050 — IT
  - COSRX               # ★ 아모레퍼시픽 090430 — US 1개뿐(인수 후 부진 시그널)
